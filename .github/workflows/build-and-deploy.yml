name: Build index & deploy

on:
  schedule:
    # 08:00 UTC — deliberately after GraphAggregator's own 06:00 UTC rebuild, so
    # each run picks up that day's crawl rather than the previous day's.
    - cron: '0 8 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'index.html'
      - '.github/workflows/build-and-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Nothing is committed back to the repo — the index is built fresh and
      # deployed straight to Pages. A failed build therefore leaves the previous
      # deployment serving, which is what we want: stale is better than empty.
      - name: Build db-site-index.json
        run: node scripts/build-site-index.mjs --out dist/db-site-index.json

      - name: Stage site contents
        run: |
          cp index.html dist/
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
