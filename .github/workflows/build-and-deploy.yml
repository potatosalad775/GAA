name: Build index & deploy

on:
  schedule:
    # 08:00 UTC — deliberately after GraphAggregator's own 06:00 UTC rebuild, so
    # each run picks up that day's crawl rather than the previous day's.
    - cron: '0 8 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'index.html'
      - '.github/workflows/build-and-deploy.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The index itself is never committed — it is built fresh and deployed
      # straight to Pages. A failed build therefore leaves the previous
      # deployment serving, which is what we want: stale is better than empty.
      - name: Build db-site-index.json
        run: node scripts/build-site-index.mjs --out dist/db-site-index.json

      - name: Stage site contents
        run: |
          cp index.html dist/
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # A plain copy for the health job; the Pages artifact is a tarball meant
      # for deploy-pages only.
      - uses: actions/upload-artifact@v4
        with:
          name: db-site-index
          path: dist/db-site-index.json
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Records day-to-day changes in data/site-health.json and writes the monthly
  # digest to HEALTH.md. A separate job so that if it fails, the deploy still
  # goes out. Commits only when something actually changed, plus once a month
  # for the digest — which also keeps the schedule from being disabled for
  # inactivity.
  health:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          name: db-site-index
          path: dist

      - name: Update site health
        run: node scripts/update-health.mjs --index dist/db-site-index.json --commit-message "$RUNNER_TEMP/health-msg"

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain -- data HEALTH.md)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data HEALTH.md
          git commit -F "$RUNNER_TEMP/health-msg"
          # Someone may have pushed while we ran; this job only touches its own
          # files, so a rebase cannot conflict with theirs.
          git pull --rebase --quiet origin main
          git push origin HEAD:main

      # Belt and braces for the inactivity rule: re-enabling an enabled workflow
      # through the API is a no-op that also resets GitHub's 60-day timer. The
      # monthly digest commit should already be enough on its own.
      - name: Keep schedule alive
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/build-and-deploy.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
